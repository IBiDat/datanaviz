# Types of Data

---
class: base24

# Forms of Data

--

### Entities

- The objects of interest, what we wish to visualize (e.g. a *sale*)
- Also known as **observations**, **records**, **instances**, **cases**...

--

### Relations

- Relationships between entities (e.g. a *customer* makes a *sale*)
- Many kinds: hierarchical, network, temporal, causal...
- Sometimes provided explicitly (e.g. edges in a network),
  sometimes its discovery is the purpose of the visualization (e.g. correlation)

--

### Attributes

- Properties of entities and relations (e.g. *price* and the *profit* of a sale)
- Also known as **features**, **variables**, **covariates**, **dimensions**...
- Can be qualitative or quantitative

---

# Types of Attributes

--

### Stevens' typology of measurement scales (1946)

- **Nominal**: purely qualitative, categories without order (e.g. fruits)
- **Ordinal**: qualitative with order (e.g. weekdays)
- **Interval**: quantitative data with no zero point (e.g. time of departure)
- **Ratio**: quantitative data with zero point (e.g. money)

--

### In practice

.font120[
- **Categorical data**: nominal or ordinal (e.g. fruits, weekdays)
- **Discrete data**: ordered categories or counts (e.g. number of visits)
- **Continuous data**: interval or ratio (e.g. time, money)
]

--

### Uncertainty

- Continuous data often come with a measure of uncertainty
- Can be represented as an additional attribute (e.g. confidence interval)
- Visualization of uncertainty is important but often overlooked

// adds .remark-code-has-line-highlighted class to <pre> parent elements

(function(d) {
  const hlines = d.querySelectorAll('.remark-code-line-highlighted');
  const preParents = [];
  const findPreParent = function(line, p = 0) {
    if (p > 1) return null; // traverse up no further than grandparent
    const el = line.parentElement;
    return el.tagName === "PRE" ? el : findPreParent(el, ++p);
  };

  for (let line of hlines) {
    let pre = findPreParent(line);
    if (pre && !preParents.includes(pre)) preParents.push(pre);
  }
  preParents.forEach(p => p.classList.add("remark-code-has-line-highlighted"));

<script>
slideshow._releaseMath = function(el) {
  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||
          /^\$\$(.|\s)+\$\$$/.test(text) ||
          /^\\begin\{([^}]+)\}(.|\s)+\\end\{[^}]+\}$/.test(text)) {
        code.outerHTML = code.innerHTML;  // remove <code></code>
        continue;
      }
    }
    i++;
  }
};
slideshow._releaseMath(document);
